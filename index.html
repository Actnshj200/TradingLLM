    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }

        #chatbot {
            width: 400px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        #chatbot-messages {
            height: 300px;
            overflow-y: scroll;
            margin-bottom: 10px;
            padding: 10px;
            background-color: #fff;
            border-radius: 5px;
        }

        .user-message {
            margin-bottom: 10px;
            color: #333;
            font-weight: bold;
        }

        .chatbot-message {
            margin-bottom: 10px;
            color: #666;
        }

        #chatbot-input {
            width: 80%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #chatbot-send {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .tradingview-message {
            margin-bottom: 10px;
            color: #ff6600;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="chatbot">
        <div id="chatbot-messages"></div>
        <input type="text" id="chatbot-input" placeholder="Type your message...">
        <button id="chatbot-send">Send</button>
        <button id="chatbot-buy">Buy</button>
    </div>

    <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=65fd0a6b1eaf5ffad2023d68" type="text/javascript" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <script src="js/webflow.js" type="text/javascript"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatbotMessages = document.getElementById('chatbot-messages');
            const chatbotInput = document.getElementById('chatbot-input');
            const chatbotSend = document.getElementById('chatbot-send');

            let sessionId = getCookie('sessionId');
            if (!sessionId) {
                sessionId = generateUniqueId();
                setCookie('sessionId', sessionId, 1);
            }

            chatbotSend.addEventListener('click', async () => {
                const userMessage = chatbotInput.value;
                chatbotInput.value = '';

                const userMessageElement = document.createElement('div');
                userMessageElement.classList.add('user-message');
                userMessageElement.textContent = 'You: ' + userMessage;
                chatbotMessages.appendChild(userMessageElement);

                try {
                    const response = await fetch('/.netlify/functions/hugging-face-api', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: userMessage, sessionId: sessionId })
                    });
                    const data = await response.json();

                    const chatbotMessageElement = document.createElement('div');
                    chatbotMessageElement.classList.add('chatbot-message');
                    chatbotMessageElement.textContent = 'Chatbot: ' + data.response;
                    chatbotMessages.appendChild(chatbotMessageElement);

                    chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
                } catch (error) {
                    console.error('Error:', error);
                }
            });

            chatbotInput.addEventListener('keypress', (event) => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    chatbotSend.click();
                }
            });

            const chatbotBuy = document.getElementById('chatbot-buy');

            chatbotBuy.addEventListener('click', async () => {
                try {
                    const response = await fetch('/.netlify/functions/Coinbase', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'buy' })
                    });
                    const data = await response.json();

                    const tradingViewMessageElement = document.createElement('div');
                    tradingViewMessageElement.classList.add('tradingview-message');
                    tradingViewMessageElement.textContent = 'Buy order placed: ' + JSON.stringify(data);
                    chatbotMessages.appendChild(tradingViewMessageElement);

                    chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
                } catch (error) {
                    console.error('Error:', error);
                }
            });

            function generateUniqueId() {
                return Math.random().toString(36).substring(7);
            }

            function setCookie(name, value, days) {
                const expires = new Date();
                expires.setTime(expires.getTime() + days * 24 * 60 * 60 * 1000);
                document.cookie = name + '=' + value + ';expires=' + expires.toUTCString() + ';path=/';
            }

            function getCookie(name) {
                const cookieName = name + '=';
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    let cookie = cookies[i];
                    while (cookie.charAt(0) === ' ') {
                        cookie = cookie.substring(1);
                    }
                    if (cookie.indexOf(cookieName) === 0) {
                        return cookie.substring(cookieName.length, cookie.length);
                    }
                }
                return '';
            }
        });
    </script>
</body>
